<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create or Edit Offer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Offer System</a>
        <div class="navbar-nav ms-auto">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/login}">Logout</a>
            </div>

        </div>


    </div>
</nav>

<div class="container mt-5">
    <h2 th:text="${offer.id == null ? 'Create New Offer' : 'Edit Offer'}"></h2>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/agency/new}"
          method="post" enctype="multipart/form-data" th:object="${offer}">

        <!-- Job Title -->
        <div class="mb-3">
            <label for="title" class="form-label">Job Title</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required placeholder="Enter job title">
        </div>

        <!-- Job Description -->
        <div class="mb-3">
            <label for="description" class="form-label">Job Description</label>
            <textarea class="form-control" id="description" th:field="*{description}" required placeholder="Enter job description"></textarea>
        </div>

        <!-- Company Name -->
        <div class="mb-3">
            <label for="companyName" class="form-label">Company Name</label>
            <input type="text" class="form-control" id="companyName" th:field="*{companyName}" required placeholder="Enter company name">
        </div>

        <!-- Location -->
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" th:field="*{location}" required placeholder="Enter job location">
        </div>

        <!-- Salary -->
        <div class="mb-3">
            <label for="salary" class="form-label">Salary</label>
            <input type="number" class="form-control" id="salary" th:field="*{salary}" step="0.01" required placeholder="Enter salary amount">
        </div>

        <!-- Status -->
        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" th:field="*{status}" required>
                <option th:each="status : ${T(org.example.recrutement.Entity.Enum.StatusEnum).values()}"
                        th:value="${status}"
                        th:text="${status}"></option>
            </select>
        </div>

        <!-- Expiry Date -->
        <div class="mb-3">
            <label for="expiryDate" class="form-label">Expiry Date</label>
            <input type="datetime-local" class="form-control" id="expiryDate" th:field="*{expiryDate}" required>
        </div>

        <!-- Image Upload -->
        <div class="mb-3">
            <label for="imageFile" class="form-label">Upload Company Logo (Optional)</label>
            <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*">
            <div class="form-text">Upload a company logo (optional). Only image files are allowed.</div>
        </div>
        <div th:if="${offer.image != null}" class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="removeImage" name="removeImage">
                <label class="form-check-label" for="removeImage">Remove current image</label>
            </div>
            <img th:src="@{'/agency/image/' + ${offer.id}}" style="max-height: 100px;" class="img-thumbnail">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-success">Submit Offer</button>
        <a th:href="@{/agency/new}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
