<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Recruitment System</a>
        <div class="navbar-nav ms-auto">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/login}">Logout</a>
            </div>

        </div>


    </div>
</nav>

<div class="container mt-4">
    <h2>Admin Dashboard</h2>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Agencies</h5>
                    <h2 class="card-text" th:text="${agencyCount}">0</h2>
                    <a th:href="@{/agencies}" class="text-white">View All</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Offers</h5>
                    <h2 class="card-text" th:text="${offerCount}">0</h2>
                    <a th:href="@{/offers}" class="text-white">View All</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-info mb-3">
                <div class="card-body">
                    <h5 class="card-title">Applications</h5>
                    <h2 class="card-text" th:text="${applicationCount}">0</h2>
                    <a th:href="@{/applications}" class="text-white">View All</a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
