<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Job Applications</h2>
        <a class="btn btn-primary" th:href="@{/applications/new}">+ Add Application</a>
    </div>

    <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>Offer</th>
            <th>Applicant</th>
            <th>Status</th>
            <th>Submitted</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="app : ${applications}">
            <td th:text="${app.offer != null ? app.offer.title : 'No Offer'}">Offer Title</td>
            <td th:text="${app.client != null && app.client.user != null ? app.client.user.username : 'N/A'}">Applicant</td>

            <td>
                <form th:action="@{/applications/status/update}" method="post">
                    <input type="hidden" th:name="applicationId" th:value="${app.id}">
                    <select class="form-select" name="status" th:value="${app.status}">
                        <option th:each="status : ${T(org.example.recrutement.Entity.Enum.StatusApplicationEnum).values()}"
                                th:value="${status}"
                                th:text="${status.name()}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary mt-2">Update Status</button>
                </form>
            </td>

            <td th:text="${app.submittedAt != null ? #temporals.format(app.submittedAt, 'dd/MM/yyyy HH:mm') : 'N/A'}">Date</td>
            <td>
                <a th:href="@{/applications/delete/{id}(id=${app.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
            </td>


        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
