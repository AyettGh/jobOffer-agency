<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Offers - Recruitment System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Recruitment System</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Job Offers</h2>
        <a th:href="@{/offers/new}" class="btn btn-primary">Create New Offer</a>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">
        <div th:each="offer : ${offers}" class="col-md-4 mb-4">
            <div class="card h-100">
                <img th:if="${offer.image != null}"
                     th:src="'data:image/jpeg;base64,' + ${offer.image}"
                     class="card-img-top"
                     style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${offer.title}"></h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${offer.companyName}"></h6>
                    <p class="card-text" th:text="${offer.description}"></p>
                    <div class="d-flex justify-content-between">
                        <span class="badge bg-info" th:text="${offer.status}"></span>
                        <span class="text-muted" th:text="${#temporals.format(offer.expiryDate, 'dd/MM/yyyy')}"></span>
                    </div>
                    <div class="mt-2">
                        <div class="text-muted" th:text="'Location: ' + ${offer.location}"></div>
                        <div class="text-muted" th:text="'Salary: ' + ${offer.salary}"></div>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{'/offers/edit/' + ${offer.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a th:href="@{'/offers/delete/' + ${offer.id}}" class="btn btn-sm btn-outline-danger">Delete</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
