<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${agency.id} ? 'Edit Agency' : 'Add Agency'">Add Agency</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${agency.id} ? 'Edit Agency' : 'Add Agency'">Add Agency</h1>
    <form th:action="@{${agency.id != null ? '/agencies/edit/' + agency.id : '/agencies/new'}}"
          th:object="${agency}" method="post">
        <div class="form-group">
            <label>Company Name</label>
            <input type="text" class="form-control" th:field="*{companyName}" required>
        </div>
        <div class="form-group">
            <label>Contact Person</label>
            <input type="text" class="form-control" th:field="*{contactPerson}" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" class="form-control" th:field="*{number}" required>
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" class="form-control" th:field="*{address}" required>
        </div>
        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" th:field="*{verified}">
            <label class="form-check-label">Verified</label>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/agencies}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
