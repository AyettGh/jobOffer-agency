<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Submit New Application</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/client/new}" method="post" enctype="multipart/form-data" th:object="${application}">

        <div class="mb-3">
            <label for="offerId" class="form-label">Job Offer</label>
            <select class="form-select" id="offerId" name="offerId" required>
                <option value="" disabled selected>Select offer</option>
                <option th:each="offer : ${offers}"
                        th:value="${offer.id}"
                        th:text="${offer.title}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="clientId" class="form-label">Applicant</label>
            <select class="form-select" id="clientId" name="clientId" required>
                <option value="" disabled selected>Select applicant</option>
                <option th:each="client : ${clients}"
                        th:value="${client.id}"
                        th:text="${client.user != null ? client.user.username : 'Unnamed Client'}">
                </option>

            </select>
        </div>

        <div class="mb-3">
            <label for="cvFile" class="form-label">CV (PDF only)</label>
            <input type="file" class="form-control" id="cvFile" name="cvFile" accept=".pdf" required>
            <div class="form-text">Please upload your CV in PDF format</div>
        </div>

        <button type="submit" class="btn btn-success">Submit</button>

        <a th:href="@{/client}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
